name: Windows desktop build

on:
  push:
    branches: [develop/desktop-foundation]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name PackAnalisisDentales --collect-all PySide6 --collect-all cv2 run.py
      - uses: actions/upload-artifact@v4
        with:
          name: PackAnalisisDentales-Windows
          path: dist/PackAnalisisDentales/
          if-no-files-found: error
