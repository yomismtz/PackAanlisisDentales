name: Windows desktop build

on:
  push:
    branches: [develop/desktop-foundation, feature/avis-multiplatform-local]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name AVIS --collect-all PySide6 --collect-all cv2 --add-data "clients/web/public/avis-logo.svg;clients/web/public" --add-data "clients/web/public/birds;clients/web/public" run.py
      - name: Verify executable
        run: |
          if (!(Test-Path 'dist/AVIS/AVIS.exe')) { throw 'AVIS.exe was not generated' }
      - uses: actions/upload-artifact@v4
        with:
          name: AVIS-Windows-x64
          path: dist/AVIS/
          if-no-files-found: error
          retention-days: 14
