name: AVIS core tests

on:
  push:
    branches: [feature/avis-multiplatform-local]
  pull_request:
    branches: [develop/desktop-foundation]
    paths:
      - "app/**"
      - "avis_core/**"
      - "tests/**"
      - "clients/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/avis-core-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries required by Qt/OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libglib2.0-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Test web cephalometric geometry
        run: npm run test:geometry
      - name: Test web model calculations
        run: npm run test:models
      - name: Test web photo geometry
        run: npm run test:photo
      - name: Build AVIS web/PWA
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AVIS-Web-PWA
          path: clients/web/dist/
          if-no-files-found: error
          retention-days: 14

  windows-desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build AVIS executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name AVIS --collect-all PySide6 --collect-all cv2 run.py
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AVIS/AVIS.exe')) { throw 'AVIS.exe was not generated' }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AVIS-Windows-x64
          path: dist/AVIS/
          if-no-files-found: error
          retention-days: 14
