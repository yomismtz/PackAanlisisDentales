name: AVIS core tests

on:
  push:
    branches:
      - feature/avis-multiplatform-local
  pull_request:
    branches:
      - develop/desktop-foundation
    paths:
      - "app/**"
      - "tests/**"
      - "clients/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/avis-core-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/web/package.json
      - name: Install dependencies
        run: npm install
      - name: Build AVIS web/PWA
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AVIS-Web-PWA
          path: clients/web/dist/
          if-no-files-found: error
          retention-days: 14
