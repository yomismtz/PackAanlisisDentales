name: AVIS core tests

on:
  push:
    branches: [feature/avis-multiplatform-local]
  pull_request:
    branches: [develop/desktop-foundation]
    paths:
      - "app/**"
      - "tests/**"
      - "clients/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/avis-core-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries required by Qt/OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libglib2.0-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q

  web-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only
      - name: Install exact locked dependencies
        run: npm ci
      - name: Build AVIS web/PWA
        run: npm run build
      - name: Commit generated lockfile to the development branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "chore(web): add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AVIS-Web-PWA
          path: clients/web/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload npm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: AVIS-Web-Lockfile
          path: clients/web/package-lock.json
          if-no-files-found: error
          retention-days: 14
