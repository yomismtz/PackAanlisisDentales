name: AVIS core tests

on:
  push:
    branches:
      - feature/avis-multiplatform-local
  pull_request:
    branches:
      - develop/desktop-foundation
    paths:
      - "app/**"
      - "tests/**"
      - "clients/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/avis-core-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
