[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-analisis-dentales"
version = "0.1.0"
description = "Aplicación de escritorio para expedientes y análisis odontológicos"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "numpy>=1.26", "opencv-python>=4.9", "Pillow>=10", "pydicom>=2.4", "reportlab>=4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "avis_core*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
